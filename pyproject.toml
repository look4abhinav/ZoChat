[project]
name = "zochat"
version = "0.1.0"
description = "AI support agent for a food-delivery service (ZoChat)"
readme = "README.md"
authors = [
    { name = "Abhinav Srivastava", email = "look4abhinav@outlook.in" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.14.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]
[project.scripts]
zochat = "zochat:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
markers = [
  "integration: requires network and a real API key",
  "eval: runs the golden dataset (costly)",
]
addopts = "-m 'not integration and not eval'"
